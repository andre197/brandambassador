# Local development database. Usage: npm run db:up
# Port 5434, so it can run next to the coffee shop (5432) and Опасен чар (5433).
name: brandambassador

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ba
      POSTGRES_PASSWORD: ba_dev_password
      POSTGRES_DB: ba_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba -d ba_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
